name: Reaction Commerce
description: >-
  Reaction Commerce is an open-source, API-first, headless commerce platform
  built with Node.js, React and GraphQL and deployed via Docker and Kubernetes.
  Acquired by Mailchimp in 2020, it was rebranded as Mailchimp Open Commerce and
  offered a modular, plugin-based GraphQL API stack aimed at technical,
  growth-minded retailers. The core `reaction` platform is now discontinued, but
  its developer documentation, GraphQL API reference, CLI and npm packages remain
  published under the @reactioncommerce scope. The API is GraphQL and self-hosted;
  a default local instance exposes its endpoint at http://localhost:3000/graphql,
  and an interactive GraphQL Playground is provided in the developer docs.
