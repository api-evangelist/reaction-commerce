generated: '2026-07-20'
method: searched
source: https://www.npmjs.com/org/reactioncommerce
notes: >-
  First-party libraries published under the official @reactioncommerce npm scope
  for Mailchimp Open Commerce (formerly Reaction Commerce). Open Commerce is an
  open-source, self-hosted GraphQL commerce platform; these are the framework
  building blocks used to build and extend an Open Commerce API server and
  storefront. The core `reaction` platform is discontinued but the packages
  remain published on npm.
packages:
  - language: javascript
    registry: npm
    name: "@reactioncommerce/api-core"
    url: https://www.npmjs.com/package/@reactioncommerce/api-core
    install: npm install @reactioncommerce/api-core
    description: >-
      Provides the ReactionAPICore class used to build and run an Open Commerce
      GraphQL API server.
    official: true
  - language: javascript
    registry: npm
    name: "@reactioncommerce/api-utils"
    url: https://www.npmjs.com/package/@reactioncommerce/api-utils
    install: npm install @reactioncommerce/api-utils
    description: Utility functions for the Reaction / Open Commerce API.
    official: true
  - language: javascript
    registry: npm
    name: "@reactioncommerce/reaction-error"
    url: https://www.npmjs.com/package/@reactioncommerce/reaction-error
    install: npm install @reactioncommerce/reaction-error
    description: Error handling for the Reaction / Open Commerce API.
    official: true
  - language: javascript
    registry: npm
    name: "@reactioncommerce/schemas"
    url: https://www.npmjs.com/package/@reactioncommerce/schemas
    install: npm install @reactioncommerce/schemas
    description: The collection schemas API for Reaction Commerce.
    official: true
  - language: javascript
    registry: npm
    name: "@reactioncommerce/components"
    url: https://www.npmjs.com/package/@reactioncommerce/components
