    description: Reaction Commerce example storefront React component library.
    official: true
  - language: javascript
    registry: npm
    name: "@reactioncommerce/catalyst"
    url: https://www.npmjs.com/package/@reactioncommerce/catalyst
    install: npm install @reactioncommerce/catalyst
