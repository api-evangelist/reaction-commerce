plugins:
  note: >-
    Open Commerce is plugin-based; the @reactioncommerce/api-plugin-* family
    (carts, orders, catalogs, shops, notifications, i18n, files, surcharges,
    settings, email-templates, ...) provides the pluggable GraphQL API domains.
  examples:
    - "@reactioncommerce/api-plugin-carts"
    - "@reactioncommerce/api-plugin-orders"
    - "@reactioncommerce/api-plugin-catalogs"
    - "@reactioncommerce/api-plugin-shops"
    - "@reactioncommerce/api-plugin-notifications"
